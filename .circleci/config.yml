version: 2.1

jobs:
  build:
    macos:
      xcode: "15.4.0"
    environment:
      FL_OUTPUT_DIR: output
    steps:
      - checkout

      - run:
          name: Build the app
          command: |
            xcodebuild -project CircleCi.xcodeproj \
              -scheme CircleCi \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 12,OS=15.2' \
              clean build  # Build the app

      - run:
          name: Run Unit Tests
          command: |
            xcodebuild test -project CircleCi.xcodeproj \
              -scheme CircleCi \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 12,OS=15.2'  # Run unit tests

      - run:
          name: Run UI Tests
          command: |
            xcodebuild test -project CircleCi.xcodeproj \
              -scheme CircleCiUITests \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 12,OS=15.2'  # Run UI tests (if applicable)

workflows:
  version: 2
  build_and_test:
    jobs:
      - build 
