version: 2.1

jobs:
  build:
    macos:
      xcode: "14.3.1"  # Use the Xcode version compatible with your project
    working_directory: ~/project
    steps:
      - checkout  # Pull the code from the repository

      - run:
          name: Install Cocoapods (if required)
          command: |
            if [ -f "Podfile" ]; then
              brew install cocoapods || true
              pod install
            else
              echo "No Podfile found. Skipping pod install."
            fi

      - run:
          name: Build the Project
          command: |
            xcodebuild build \
            -workspace YourProject.xcworkspace \
            -scheme YourScheme \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

workflows:
  version: 2
  build_workflow:
    jobs:
      - build

