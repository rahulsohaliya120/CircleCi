version: 2.1

executors:
  macos-executor:
    macos:
      version: 14.4.1
    working_directory: ~/workspace

jobs:
  build:
    executor: macos-executor
    steps:
      - checkout # Check out the source code
      - run:
          name: Build the App
          command: |
            xcodebuild clean build -workspace /Users/dreamworld/Documents/CircleCI\:CD/CircleCi.xcworkspace -scheme CircleCi -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 12,OS=latest'
          
  test:
    executor: macos-executor
    steps:
      - checkout # Check out the source code
      - run:
          name: Run Unit Tests
          command: |
            xcodebuild test -workspace /Users/dreamworld/Documents/CircleCI\:CD/CircleCi.xcworkspace -scheme CircleCi -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 12,OS=latest'

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build

