version: 2.1

executors:
  macos_executor:
    macos:
      xcode: "15.4.0"

jobs:
  build-and-test:
    executor: macos_executor
    steps:
      - checkout

      # Install dependencies (skip SPM/CocoaPods as per your requirement)
      - run:
          name: Install Dependencies
          command: |
            echo "No additional dependencies to install."

      # Run tests
      - run:
          name: Run Tests
          command: |
            xcodebuild \
              -workspace YourProject.xcworkspace \
              -scheme CircleCi \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 14' \
              clean test

      # Build the app
      - run:
          name: Build App
          command: |
            xcodebuild \
              -workspace YourProject.xcworkspace \
              -scheme CircleCi \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 14' \
              clean build

workflows:
  version: 2
  test-and-build:
    jobs:
      - build-and-test

