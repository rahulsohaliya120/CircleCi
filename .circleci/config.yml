version: 2.1

executors:
  macos_executor:
    macos:
      xcode: "15.4"

jobs:
  build-and-test:
    executor: macos_executor
    steps:
      - checkout

      # Run tests
      - run:
          name: Run Tests
          command: |
            xcodebuild \
              -project CircleCi.xcodeproj \
              -scheme CircleCi \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 13' \
              clean test

      # Build the app
      - run:
          name: Build App
          command: |
            xcodebuild \
              -project CircleCi.xcodeproj \
              -scheme CircleCi \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 13' \
              clean build

workflows:
  version: 2
  test-and-build:
    jobs:
      - build-and-test


